; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build outside the Unicode/space project path (gcc response files cannot
; open temp paths containing non-ASCII characters on Windows).
build_dir = C:/.pio/builds/NodeControl

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink
; Never compile the (deleted) reference copy if OneDrive re-syncs it back
build_src_filter = +<*> -<newNodecontrol/>
; CP2102 USB-to-serial dùng để xem log (Serial.print qua USART1/PA9-PA10)
monitor_port = COM17
monitor_speed = 9600
; Shared protocol library (single source of truth in Gateway/src/common).
; The -I is injected as a raw relative flag by inject_common.py (see that
; file for why a plain build_flags -I does not work under a Unicode path).
extra_scripts = pre:inject_common.py
