; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build outside the Unicode/space project path (xtensa-gcc response files
; cannot open temp paths containing non-ASCII characters on Windows).
build_dir = C:/.pio/builds/Node

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM18
upload_speed = 115200
monitor_port = COM18
monitor_speed = 115200
; Never compile the (deleted) reference copy if OneDrive re-syncs it back
build_src_filter = +<*> -<newStruct/>
; Shared protocol library (single source of truth in Gateway/src/common).
; The -I is injected as a raw relative flag by inject_common.py (see that
; file for why a plain build_flags -I does not work under a Unicode path).
extra_scripts = pre:inject_common.py
lib_deps =
	xreef/EByte LoRa E32 library@^1.5.13
	beegee-tokyo/DHT sensor library for ESPx@^1.19.0
	plerup/EspSoftwareSerial@^8.2.0
